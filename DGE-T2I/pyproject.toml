[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dge_t2i"
version = "0.1.0"
description = "A comprehensive framework for evaluating and generating examples for text-to-image generation"
dependencies = [
    "bitsandbytes==0.48.2",
    "diffusers==0.34.0",
    "transformers==4.57.1",
    "torch",
    "accelerate==1.8.1",
    "einops==0.8.1",
    "safetensors==0.5.3",
    "opencv-python==4.12.0.88",
    "supervision==0.25.1",
    "pycocotools==2.0.10",
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.3",
    "pandas==2.3.0"
] 

[tool.setuptools.packages.find]
where = ["src"]
